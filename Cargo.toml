[package]
name = "rorys-package-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tokio providdes the async engine for URL checking
tokio = {version = "1.38", features = ["full"]}

# TLS and HTTP requests need reqwest
reqwest = {version = "0.12", features = ["blocking","json"]}

# Serde will conver raw JSON strings into type-sade
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"

# Cryptographic hashing for download integrity
sha2 = "0.10"

# Regular expressions for livecheck and asset matching
regex = "1.10"
terminal_size = "0.4.4"
