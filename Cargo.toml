[package]
name = "rorys-package-manager"
version = "0.4.3"
edition = "2024"
license = "BSD-2-Clause"

[[bin]]
name = "rpm"
path = "src/main.rs"

[dependencies]
# Tokio providdes the async engine for URL checking
tokio = {version = "1.38", features = ["full"]}

# TLS and HTTP requests need reqwest
reqwest = {version = "0.12", features = ["blocking","json"]}

# Serde and TOML serialization for recipes and state cache
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
toml = "0.8"

# Cryptographic hashing for download integrity
sha2 = "0.10"

# Regular expressions for livecheck and asset matching
regex = "1.10"
terminal_size = "0.4.4"

[dev-dependencies]
tempfile = "3.10"
